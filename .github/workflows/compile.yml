name: compile

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Arduino needs the sketch folder to have the same name as the .ino file.
      - name: Arrange sketch folder
        run: |
          mkdir -p "build/Arduino_Follow_Me_Robot"
          find . -maxdepth 1 -type f \( -name '*.ino' -o -name '*.cpp' -o -name '*.h' \) -exec cp {} "build/Arduino_Follow_Me_Robot/" \;
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          libraries: |
            - name: Adafruit Motor Shield library
            - name: NewPing
            - name: Servo
          sketch-paths: |
            - build/Arduino_Follow_Me_Robot
